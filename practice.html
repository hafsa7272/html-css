<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .case-btn {
            position: relative;
        }

        .dropdown-panel {
            position: absolute;
            display: none;
            padding: 30px 40px;
            align-items: flex-start;
            background: #ffffff;
            width: 800px;
        }

        .case-btn:hover .dropdown-panel {
            display: flex;
        }

        .panel-heading p {
            font-size: 20px;
            font-weight: 600;
            color: #111111;
            line-height: 1.4;
            width: 289px;
        }

        .panel-links {
            display: flex;
            gap: 60px;
            padding-left: 136px;
        }

        .panel-links a:hover {
            text-decoration: underline;
        }

        .panel-links a {
            font-size: 15px;
            color: #333333;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="case-btn">
        <button>case study</button>
        <div class="dropdown-panel">
            <div class="panel-heading">
                <p>Testaments of research and development structure for success stories that we helped create!</p>
            </div>
            <div class="panel-links">
                <a href="#">Case Study</a>
                <a href="#">Portfolio</a>
            </div>
        </div>
    </div>
</body>
</html>
